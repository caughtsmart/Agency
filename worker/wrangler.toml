#:schema node_modules/wrangler/config-schema.json
name = "workings-lead"
main = "src/index.js"
compatibility_date = "2026-01-15"
workers_dev = false

# ---------------------------------------------------------------------------
# Route the Worker on the same domain as the site. This matters: it makes the
# browser's fetch('/api/lead') a same-origin request, so CORS never gets a vote
# and there is no preflight round trip to pay for.
#
# Swap workings.co.uk for the real domain, then `wrangler deploy`.
# ---------------------------------------------------------------------------
routes = [
  { pattern = "workings.co.uk/api/*", zone_name = "workings.co.uk" },
  { pattern = "www.workings.co.uk/api/*", zone_name = "workings.co.uk" }
]

[vars]
# The only origin CORS is opened to. Not a secret, so it lives here.
ALLOWED_ORIGIN = "https://workings.co.uk"

# ---------------------------------------------------------------------------
# D1. Create it once, then paste the id it prints in here:
#
#   npx wrangler d1 create workings-leads
#   npx wrangler d1 execute workings-leads --remote --file=./schema.sql
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "workings-leads"
database_id = "PASTE_DATABASE_ID_HERE"

[observability]
enabled = true

# Weekly retention sweep: deletes audit submissions older than 24 months and
# stale rate-limit rows, so the privacy notice keeps itself honest.
[triggers]
crons = ["17 4 * * 1"]

# ---------------------------------------------------------------------------
# Secrets — set with `npx wrangler secret put NAME`. Never in this file.
#
#   NOTIFY_EMAIL     where the [LEAD] email lands
#   FROM_EMAIL       the verified sending address (use Graham's own)
#   RESEND_API_KEY   from resend.com
#   ADMIN_KEY        guards GET /api/leads — use `openssl rand -hex 32`
#   RATE_SALT        salts the IP hash — use `openssl rand -hex 32`
# ---------------------------------------------------------------------------
